<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- favicon del editor de packs: escudo del frame de boss (dark + dorado del tema) con calavera sobre espadas cruzadas -->
	<defs>
		<linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f3e29b"/>
			<stop offset=".5" stop-color="#d1a345"/>
			<stop offset="1" stop-color="#8a6d20"/>
		</linearGradient>
		<linearGradient id="hueso" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f2ead2"/>
			<stop offset="1" stop-color="#c8bfa0"/>
		</linearGradient>
	</defs>
	<!-- escudo -->
	<rect x="2.5" y="2.5" width="59" height="59" rx="10" fill="#15151b" stroke="url(#g)" stroke-width="3"/>
	<!-- remates de esquina del frame -->
	<path d="M7 15 L7 9 Q7 7 9 7 L15 7" fill="none" stroke="#8a6d20" stroke-width="2"/>
	<path d="M57 15 L57 9 Q57 7 55 7 L49 7" fill="none" stroke="#8a6d20" stroke-width="2"/>
	<path d="M7 49 L7 55 Q7 57 9 57 L15 57" fill="none" stroke="#8a6d20" stroke-width="2"/>
	<path d="M57 49 L57 55 Q57 57 55 57 L49 57" fill="none" stroke="#8a6d20" stroke-width="2"/>
	<!-- espadas cruzadas tras la calavera -->
	<g stroke="url(#g)" stroke-width="4" stroke-linecap="round">
		<line x1="16" y1="15" x2="48" y2="51"/>
		<line x1="48" y1="15" x2="16" y2="51"/>
	</g>
	<g stroke="#15151b" stroke-width="2" stroke-linecap="round">
		<line x1="14" y1="18" x2="20" y2="11"/>
		<line x1="50" y1="18" x2="44" y2="11"/>
	</g>
	<!-- calavera -->
	<ellipse cx="32" cy="30" rx="17" ry="14.5" fill="url(#hueso)"/>
	<rect x="22.5" y="37" width="19" height="12.5" rx="3" fill="url(#hueso)"/>
	<!-- cuencas -->
	<ellipse cx="24.5" cy="29.5" rx="5" ry="6.2" fill="#15151b"/>
	<ellipse cx="39.5" cy="29.5" rx="5" ry="6.2" fill="#15151b"/>
	<!-- nariz -->
	<path d="M28.5 36.5 L32 43 L35.5 36.5 Z" fill="#15151b"/>
	<!-- dientes -->
	<line x1="29" y1="41" x2="29" y2="49" stroke="#15151b" stroke-width="1.6"/>
	<line x1="35" y1="41" x2="35" y2="49" stroke="#15151b" stroke-width="1.6"/>
</svg>